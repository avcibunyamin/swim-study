<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1220"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Subtle background glow -->
  <circle cx="512" cy="480" r="280" fill="#14b8a6" opacity="0.06"/>

  <!-- Wave 3 (back, subtle) -->
  <path d="M150 600 Q300 420 460 600 Q620 780 780 600"
        stroke="url(#wave)" stroke-width="32" fill="none" stroke-linecap="round" opacity="0.25" filter="url(#softglow)"/>

  <!-- Wave 2 (middle) -->
  <path d="M180 520 Q340 340 500 520 Q660 700 820 520"
        stroke="url(#wave)" stroke-width="38" fill="none" stroke-linecap="round" opacity="0.5" filter="url(#softglow)"/>

  <!-- Wave 1 (front, main) -->
  <path d="M140 460 Q320 260 500 460 Q680 660 860 460"
        stroke="url(#wave)" stroke-width="48" fill="none" stroke-linecap="round" filter="url(#glow)"/>

  <!-- SWIM Text -->
  <text x="512" y="830" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="180" fill="url(#wave)" filter="url(#softglow)">SWIM</text>
</svg>
